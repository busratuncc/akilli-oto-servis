services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoservis}
      POSTGRES_USER: ${POSTGRES_USER:-autoservis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoservis_dev}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoservis} -d ${POSTGRES_DB:-autoservis}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://autoservis:autoservis_dev@db:5432/autoservis}
      CORS_ORIGINS: http://localhost:5174
      AUDIO_STORAGE_PATH: /app/audio-data
      MODEL_CACHE_DIR: /app/model-cache
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-in-production}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      LOCAL_LOGIN_CODE: ${LOCAL_LOGIN_CODE:-111111}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      OTP_REQUEST_INTERVAL_SECONDS: ${OTP_REQUEST_INTERVAL_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SESSION_EXPIRY_DAYS: ${SESSION_EXPIRY_DAYS:-7}
      TEST_3D_SECURE_CODE: ${TEST_3D_SECURE_CODE:-123456}
      TEST_3D_EXPIRY_MINUTES: ${TEST_3D_EXPIRY_MINUTES:-5}
      TEST_3D_MAX_ATTEMPTS: ${TEST_3D_MAX_ATTEMPTS:-3}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Akıllı Oto Servis <noreply@akilli-servis.local>}
      MAILPIT_PUBLIC_URL: ${MAILPIT_PUBLIC_URL:-http://localhost:8026}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5174}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - audio_data:/app/audio-data
      - model_cache:/app/model-cache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8026:8025"
      - "1026:1025"
    restart: unless-stopped

volumes:
  postgres_data:
  audio_data:
  model_cache:
  frontend_node_modules:

